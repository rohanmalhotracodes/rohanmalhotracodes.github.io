name: Update GitHub activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-github-activity.yml"
      - "scripts/update-github-activity.mjs"

permissions:
  contents: write

concurrency:
  group: update-github-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public contribution data
        run: node scripts/update-github-activity.mjs
      - name: Commit changed activity data
        run: |
          if git diff --quiet -- assets/data/github-activity.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/github-activity.json
          git commit -m "Refresh GitHub activity"
          git push
